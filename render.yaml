# Render Blueprint: one Docker web service serving the API, Socket.IO and the built SPA.
# Create it from the Render dashboard: New -> Blueprint -> pick this repository.
services:
  - type: web
    name: mparlament
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Generated once and kept across deploys; tokens stay valid until the value changes.
      - key: MPARLAMENT_JWT_SECRET
        generateValue: true
      # The free plan has no persistent disk: the SQLite DB is recreated on every deploy, so
      # the demo data has to be re-seeded on start.
      - key: MPARLAMENT_SEED_ON_START
        value: "true"
      # Frontend source baked into the image. The upstream SPA repo belongs to someone else,
      # so this points at our own fork; the Docker build clones it anonymously, which means
      # the fork has to be public. Pin FRONTEND_REF to a SHA so a cached layer cannot serve a
      # stale clone (branch and tag names work too).
      - key: FRONTEND_SLUG
        value: Macions/mparlament # TODO: replace with <your-github-user>/mparlament
      - key: FRONTEND_REF
        value: main # TODO: replace with the deploy/same-origin commit SHA
